[project]
name = "voice-attribute-service"
version = "0.1.0"
description = "Streaming-first FastAPI backend for real-time voice attribute analysis using SpeechBrain ECAPA-TDNN"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "joblib>=1.5.3",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.28",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "soundfile>=0.13.1",
    "speechbrain>=1.1.0",
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
    "uvicorn[standard]>=0.47.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
